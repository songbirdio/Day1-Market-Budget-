<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#FFF7EC" />
    <title>Market Budget Calculator</title>

    <!-- ============ FONT: warm, modern, readable ============ -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <!-- ============ CSS: how the page LOOKS ============ -->
    <style>
      /* All colours live here — change once, updates everywhere */
      :root {
        --cream: #fff7ec;
        --ink: #2a1c10;
        --muted: #8b7660;
        --line: rgba(120, 90, 50, 0.14);
        --card: #ffffff;
        --green: #17805a;
        --green-soft: #e4f3ec;
        --red: #c0392b;
        --red-soft: #fdeae7;
        --orange: #e8752b;
        --amber: #f2a93b;
        --radius: 20px;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100%;
        font-family:
          "Plus Jakarta Sans",
          system-ui,
          -apple-system,
          Arial,
          sans-serif;
        color: var(--ink);
        /* Warm market palette: yam cream, tomato orange, plantain green */
        background:
          radial-gradient(
            900px 520px at 8% -12%,
            #ffe3bf 0%,
            rgba(255, 227, 191, 0) 62%
          ),
          radial-gradient(
            760px 520px at 102% 2%,
            #fff0d2 0%,
            rgba(255, 240, 210, 0) 58%
          ),
          radial-gradient(
            820px 620px at 50% 112%,
            #e6f3e6 0%,
            rgba(230, 243, 230, 0) 62%
          ),
          var(--cream);
        background-attachment: fixed;
        padding: 16px;
        -webkit-font-smoothing: antialiased;
      }

      /* Very subtle basket-weave texture over the background */
      body::before {
        content: "";
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: 0;
        opacity: 0.35;
        background-image:
          repeating-linear-gradient(
            90deg,
            rgba(160, 120, 60, 0.05) 0 1px,
            transparent 1px 14px
          ),
          repeating-linear-gradient(
            0deg,
            rgba(160, 120, 60, 0.05) 0 1px,
            transparent 1px 14px
          );
        -webkit-mask-image: radial-gradient(
          circle at 50% 0%,
          #000,
          transparent 72%
        );
        mask-image: radial-gradient(circle at 50% 0%, #000, transparent 72%);
      }

      .app {
        position: relative;
        z-index: 1;
        max-width: 480px;
        margin: 0 auto;
        /* room so the floating voice orb never covers the last card */
        padding-bottom: 150px;
      }

      /* ---------- Sleek Header ---------- */
      .app-header {
        padding: 8px 4px 20px;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 8px;
      }
      .brand-icon {
        width: 28px;
        height: 28px;
        color: var(--green); /* Ties it to the app's primary color */
        flex-shrink: 0;
      }
      h1 {
        font-size: 1.6rem;
        font-weight: 800;
        letter-spacing: -0.03em;
        margin: 0;
        color: var(--ink);
      }
      .sub {
        color: var(--muted);
        margin: 0;
        font-size: 0.92rem;
        line-height: 1.6;
        font-weight: 500;
        max-width: 90%;
      }

      /* ---------- Cards ---------- */
      .card {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: var(--radius);
        padding: 18px;
        margin-bottom: 14px;
        box-shadow:
          0 12px 30px -18px rgba(70, 45, 20, 0.5),
          0 1px 0 rgba(255, 255, 255, 0.9) inset;
      }

      label {
        display: block;
        font-size: 0.78rem;
        font-weight: 600;
        letter-spacing: 0.02em;
        color: var(--muted);
        margin-bottom: 6px;
      }

      input {
        width: 100%;
        padding: 13px 14px;
        font-family: inherit;
        font-size: 1rem;
        font-weight: 600;
        color: var(--ink);
        background: #fffdf9;
        border: 1.5px solid var(--line);
        border-radius: 12px;
        margin-bottom: 10px;
        transition:
          border-color 0.18s,
          box-shadow 0.18s,
          background 0.18s;
      }
      input::placeholder {
        color: #b8a793;
        font-weight: 500;
      }
      input:focus {
        outline: none;
        background: #fff;
        border-color: var(--orange);
        box-shadow: 0 0 0 4px rgba(232, 117, 43, 0.14);
      }

      .row {
        display: flex;
        gap: 10px;
      }
      .row > div {
        flex: 1;
      }

      button {
        font-family: inherit;
      }

      .primary {
        width: 100%;
        padding: 14px;
        font-size: 1rem;
        font-weight: 700;
        border: none;
        border-radius: 13px;
        color: #fff;
        cursor: pointer;
        background: linear-gradient(135deg, #1d9169, #17805a);
        box-shadow: 0 10px 22px -12px rgba(23, 128, 90, 0.9);
        transition:
          transform 0.12s ease,
          box-shadow 0.18s ease;
      }
      .primary:active {
        transform: scale(0.985);
      }

      button.ghost {
        width: 100%;
        padding: 12px;
        font-size: 0.9rem;
        font-weight: 600;
        background: transparent;
        color: var(--red);
        border: 1.5px solid rgba(192, 57, 43, 0.35);
        border-radius: 13px;
        margin-top: 12px;
        cursor: pointer;
      }

      /* ---------- Summary ---------- */
      .summary {
        background: linear-gradient(160deg, #ffffff 0%, #fff6e9 100%);
      }
      .summary-top {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 12px;
      }
      .summary .label {
        font-size: 0.78rem;
        font-weight: 600;
        color: var(--muted);
        letter-spacing: 0.02em;
      }
      .summary .big {
        font-size: 2rem;
        font-weight: 800;
        letter-spacing: -0.03em;
        line-height: 1.15;
        margin-top: 2px;
      }
      .budget-pill {
        flex-shrink: 0;
        font-size: 0.72rem;
        font-weight: 700;
        padding: 6px 11px;
        border-radius: 999px;
        background: var(--green-soft);
        color: var(--green);
        white-space: nowrap;
      }
      .summary.over .budget-pill {
        background: var(--red-soft);
        color: var(--red);
      }

      .bar {
        height: 12px;
        background: #ede3d5;
        border-radius: 99px;
        overflow: hidden;
        margin: 14px 0 12px;
      }
      .bar-fill {
        height: 100%;
        width: 0%;
        border-radius: 99px;
        background: linear-gradient(90deg, #22a06b, #17805a);
        transition:
          width 0.4s cubic-bezier(0.22, 1, 0.36, 1),
          background 0.3s ease;
      }

      .line {
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-size: 0.9rem;
        color: var(--muted);
        margin: 7px 0;
      }
      .line strong {
        color: var(--ink);
        font-weight: 700;
      }
      .remaining.negative {
        color: var(--red);
      }

      .summary.over .big {
        color: var(--red);
      }
      .summary.over .bar-fill {
        background: linear-gradient(90deg, #e05747, #c0392b);
      }

      .warning {
        display: none;
        margin-top: 12px;
        padding: 10px 12px;
        border-radius: 12px;
        background: var(--red-soft);
        color: var(--red);
        font-size: 0.85rem;
        font-weight: 700;
      }
      .summary.over .warning {
        display: block;
        animation: shake 0.4s ease;
      }
      @keyframes shake {
        0%,
        100% {
          transform: translateX(0);
        }
        25% {
          transform: translateX(-4px);
        }
        75% {
          transform: translateX(4px);
        }
      }

      /* ---------- Item list ---------- */
      .list-title {
        display: flex;
        align-items: center;
        justify-content: space-between;
        font-weight: 700;
        font-size: 0.95rem;
        margin-bottom: 4px;
      }
      .count-badge {
        font-size: 0.72rem;
        font-weight: 700;
        color: var(--muted);
        background: #f6eddf;
        border-radius: 999px;
        padding: 4px 10px;
      }
      .item {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        padding: 12px 0;
        border-bottom: 1px solid #f2ebdf;
        animation: fadeIn 0.22s ease;
      }
      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(4px);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }
      .item:last-child {
        border-bottom: none;
      }
      .item .name {
        font-weight: 700;
        font-size: 0.95rem;
      }
      .item .detail {
        font-size: 0.78rem;
        color: var(--muted);
        margin-top: 2px;
      }
      .item-right {
        display: flex;
        align-items: center;
        gap: 10px;
        flex-shrink: 0;
      }
      .item .cost {
        font-weight: 700;
        font-size: 0.92rem;
        font-variant-numeric: tabular-nums;
      }
      .item .del {
        width: 30px;
        height: 30px;
        padding: 0;
        display: grid;
        place-items: center;
        border: none;
        border-radius: 50%;
        background: var(--red-soft);
        color: var(--red);
        font-size: 1.05rem;
        line-height: 1;
        cursor: pointer;
        transition:
          background 0.16s,
          transform 0.12s;
      }
      .item .del:active {
        transform: scale(0.9);
      }
      .item .del:hover {
        background: #f9d5d0;
      }
      .empty {
        color: var(--muted);
        text-align: center;
        padding: 18px 0 6px;
        font-size: 0.88rem;
      }

      /* ============================================================
         VOICE DOCK — the Siri-style orb floating at the bottom
         ============================================================ */
      .voice-dock {
        position: fixed;
        left: 50%;
        bottom: max(22px, env(safe-area-inset-bottom));
        transform: translateX(-50%);
        z-index: 60;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 10px;
        pointer-events: none;
        transition: opacity 0.25s ease;
      }
      .voice-dock > * {
        pointer-events: auto;
      }
      /* Hide the orb while typing so it never covers the keyboard area */
      body.typing .voice-dock {
        opacity: 0;
      }
      body.typing .voice-dock > * {
        pointer-events: none;
      }

      .orb {
        position: relative;
        width: 84px;
        height: 84px;
        padding: 0;
        border: 0;
        border-radius: 50%;
        background: none;
        cursor: pointer;
        display: grid;
        place-items: center;
        isolation: isolate;
        transition: transform 0.16s ease;
        -webkit-tap-highlight-color: transparent;
      }
      .orb:active {
        transform: scale(0.94);
      }

      /* Soft coloured halo behind everything */
      .orb-glow {
        position: absolute;
        inset: -12px;
        border-radius: 50%;
        z-index: -1;
        opacity: 0.6;
        filter: blur(16px);
        background: conic-gradient(
          from 0deg,
          #f2a93b,
          #e8752b,
          #22a06b,
          #7cc6a0,
          #f2a93b
        );
        animation: spin 7s linear infinite;
      }

      /* Thin rotating ring around the core */
      .orb-ring {
        position: absolute;
        inset: 0;
        border-radius: 50%;
        background: conic-gradient(
          from 0deg,
          #f2a93b,
          #e8752b,
          #17805a,
          #f2a93b
        );
        animation: spin 5s linear infinite;
        -webkit-mask: radial-gradient(
          farthest-side,
          transparent calc(100% - 5px),
          #000 calc(100% - 4px)
        );
        mask: radial-gradient(
          farthest-side,
          transparent calc(100% - 5px),
          #000 calc(100% - 4px)
        );
      }

      /* Expanding ripple, only visible while listening */
      .orb-pulse {
        position: absolute;
        inset: 0;
        border-radius: 50%;
        border: 2px solid rgba(232, 117, 43, 0.55);
        opacity: 0;
      }
      .orb.listening .orb-pulse {
        animation: pulseOut 1.6s ease-out infinite;
      }

      /* The solid ball that holds the moving colours + mic icon */
      .orb-core {
        position: absolute;
        inset: 7px;
        border-radius: 50%;
        overflow: hidden;
        display: grid;
        place-items: center;
        background: radial-gradient(
          circle at 32% 26%,
          #ffffff,
          #ffe9cc 55%,
          #f6c68e
        );
        box-shadow:
          inset 0 2px 10px rgba(255, 255, 255, 0.95),
          0 12px 26px -10px rgba(232, 117, 43, 0.75);
        animation: breathe 3.6s ease-in-out infinite;
      }

      /* Colour blobs swirling inside the ball — this is the "Siri" feel */
      .orb-blob {
        position: absolute;
        width: 72%;
        height: 72%;
        border-radius: 50%;
        filter: blur(9px);
        opacity: 0.7;
      }
      .b1 {
        background: #f2a93b;
        top: -14%;
        left: -18%;
        animation: swirl 6s linear infinite;
      }
      .b2 {
        background: #22a06b;
        bottom: -22%;
        right: -14%;
        animation: swirl 8s linear infinite reverse;
      }
      .b3 {
        background: #e8752b;
        bottom: -12%;
        left: 2%;
        animation: swirl 7s ease-in-out infinite;
      }

      .orb-mic {
        position: relative;
        z-index: 2;
        width: 26px;
        height: 26px;
        color: #3d2a14;
      }

      .orb.listening .orb-glow {
        opacity: 1;
        animation-duration: 2.2s;
      }
      .orb.listening .orb-ring {
        animation-duration: 2s;
      }
      .orb.listening .orb-core {
        animation-duration: 1.3s;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      @keyframes breathe {
        0%,
        100% {
          transform: scale(1);
        }
        50% {
          transform: scale(1.07);
        }
      }
      @keyframes swirl {
        0% {
          transform: rotate(0deg) translate(6px, 0) scale(1);
        }
        50% {
          transform: rotate(180deg) translate(-6px, 0) scale(1.18);
        }
        100% {
          transform: rotate(360deg) translate(6px, 0) scale(1);
        }
      }
      @keyframes pulseOut {
        0% {
          transform: scale(1);
          opacity: 0.85;
        }
        100% {
          transform: scale(1.85);
          opacity: 0;
        }
      }

      .orb-hint {
        font-size: 0.72rem;
        font-weight: 700;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        color: var(--muted);
        background: rgba(255, 255, 255, 0.85);
        border: 1px solid var(--line);
        padding: 5px 12px;
        border-radius: 999px;
        backdrop-filter: blur(6px);
      }

      /* ---------- Voice sheet (speech bubble above the orb) ---------- */
      .voice-sheet {
        width: min(340px, 86vw);
        background: #fff;
        border: 1px solid var(--line);
        border-radius: 18px;
        padding: 14px 16px 12px;
        box-shadow: 0 22px 44px -18px rgba(70, 45, 20, 0.55);
        animation: pop 0.22s ease;
      }
      .voice-sheet[hidden] {
        display: none;
      }
      @keyframes pop {
        from {
          opacity: 0;
          transform: translateY(8px) scale(0.97);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }
      .voice-head {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 0.75rem;
        font-weight: 800;
        letter-spacing: 0.05em;
        text-transform: uppercase;
        color: var(--orange);
      }
      .voice-dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--orange);
        animation: blink 1.1s ease-in-out infinite;
      }
      @keyframes blink {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.25;
        }
      }
      .voice-transcript {
        margin: 10px 0 12px;
        font-size: 0.95rem;
        font-weight: 600;
        line-height: 1.45;
        min-height: 2.6em;
      }
      .voice-transcript.hint {
        color: var(--muted);
        font-weight: 500;
        font-size: 0.88rem;
      }
      .voice-actions {
        display: flex;
        gap: 8px;
        justify-content: flex-end;
      }
      .chip {
        border: 0;
        border-radius: 999px;
        padding: 9px 18px;
        font-family: inherit;
        font-size: 0.84rem;
        font-weight: 700;
        cursor: pointer;
        background: var(--green);
        color: #fff;
      }
      .chip.ghost {
        background: #f3eadc;
        color: var(--ink);
      }

      /* ---------- Toast ---------- */
      .toast {
        position: fixed;
        left: 50%;
        bottom: 140px;
        z-index: 90;
        transform: translate(-50%, 16px);
        max-width: 88vw;
        padding: 11px 20px;
        border-radius: 999px;
        background: #2a1c10;
        color: #fff;
        font-size: 0.84rem;
        font-weight: 600;
        text-align: center;
        opacity: 0;
        pointer-events: none;
        transition:
          opacity 0.28s ease,
          transform 0.28s ease;
        box-shadow: 0 16px 34px -14px rgba(42, 28, 16, 0.8);
      }
      .toast.show {
        opacity: 1;
        transform: translate(-50%, 0);
      }

      /* Respect users who dislike motion */
      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation-duration: 0.001ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.001ms !important;
        }
      }
      /* =========================================
         1. STICKY GLASSMORPHISM HEADER
         ========================================= */
      .app-header {
        position: sticky;
        top: 0;
        z-index: 50;
        padding: 12px 4px 16px;
        margin: 0 -16px; /* Stretches to the edges */
        padding-left: 16px;
        padding-right: 16px;
        transition: all 0.3s ease;
      }

      /* Added by JS when scrolling down */
      .app-header.scrolled {
        background: rgba(255, 247, 236, 0.85); /* Matches your --cream */
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        padding-top: 8px;
        padding-bottom: 8px;
        box-shadow: 0 4px 20px -10px rgba(0, 0, 0, 0.1);
        border-bottom: 1px solid rgba(120, 90, 50, 0.08);
      }
      .app-header.scrolled .brand-icon {
        transform: scale(0.9);
      }
      .app-header.scrolled h1 {
        font-size: 1.3rem;
      }

      /* Interactive Logo Hover */
      .brand-icon {
        transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
      }
      .app-header:hover .brand-icon {
        transform: rotate(-10deg) scale(1.1);
      }

      /* =========================================
         2. STAGGERED LIST ANIMATION
         ========================================= */
      /* We update the existing .item animation to use a delay */
      .item {
        animation: slideUpFade 0.35s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
        opacity: 0; /* Starts invisible */
        transform: translateY(12px);
        /* The --i variable is set by JS to stagger the delay */
        animation-delay: calc(var(--i) * 0.05s);
      }
      @keyframes slideUpFade {
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
    </style>
  </head>

  <body>
    <!-- ============ HTML: the STRUCTURE of the page ============ -->
    <div class="app">
      <header class="app-header" id="mainHeader">
        <div class="brand">
          <svg
            class="brand-icon"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"></path>
            <line x1="3" y1="6" x2="21" y2="6"></line>
            <path d="M16 10a4 4 0 0 1-8 0"></path>
          </svg>
          <h1>Market Budget</h1>
        </div>
        <p class="sub">
          Type or speak to set your budget, then track your market list in real
          time.
        </p>
      </header>

      <!-- 1. Budget -->
      <div class="card">
        <label for="budget">My budget (₦)</label>
        <input
          id="budget"
          type="number"
          inputmode="decimal"
          placeholder="e.g. 20000"
          min="0"
        />
      </div>

      <!-- 2. Summary -->
      <div class="card summary" id="summary">
        <div class="summary-top">
          <div>
            <div class="label">Total so far</div>
            <div class="big" id="total">₦0</div>
          </div>
          <div class="budget-pill" id="budgetPill">No budget set</div>
        </div>

        <div class="bar"><div class="bar-fill" id="barFill"></div></div>

        <div class="line">
          <span>Budget</span>
          <strong id="budgetOut">—</strong>
        </div>
        <div class="line">
          <span>Remaining</span>
          <strong class="remaining" id="remaining">₦0</strong>
        </div>

        <div class="warning" id="warning">⚠️ You are over budget!</div>
      </div>

      <!-- 3. Add item form -->
      <div class="card">
        <form id="itemForm">
          <label for="name">Item</label>
          <input id="name" type="text" placeholder="e.g. Tomatoes" required />
          <div class="row">
            <div>
              <label for="qty">Quantity</label>
              <input
                id="qty"
                type="number"
                inputmode="decimal"
                value="1"
                min="0"
                step="any"
                required
              />
            </div>
            <div>
              <label for="price">Price each (₦)</label>
              <input
                id="price"
                type="number"
                inputmode="decimal"
                placeholder="0"
                min="0"
                step="any"
                required
              />
            </div>
          </div>
          <button class="primary" type="submit">+ Add item</button>
        </form>
      </div>

      <!-- 4. The shopping list -->
      <div class="card">
        <div class="list-title">
          <span>My list</span>
          <span class="count-badge" id="countBadge">0 items</span>
        </div>
        <div id="list"></div>
        <button class="ghost" id="clearBtn" type="button">
          Clear whole list
        </button>
      </div>
    </div>

    <!-- ============ The floating voice orb ============ -->
    <div class="voice-dock">
      <!-- Speech bubble that appears above the orb while listening -->
      <div class="voice-sheet" id="voiceSheet" hidden>
        <div class="voice-head">
          <span class="voice-dot"></span>
          <span id="voiceStatus">Listening…</span>
        </div>
        <p
          class="voice-transcript hint"
          id="voiceTranscript"
          aria-live="polite"
        >
          Say something like “My budget is twenty thousand naira”
        </p>
        <div class="voice-actions">
          <button type="button" class="chip ghost" id="voiceCancel">
            Cancel
          </button>
          <button type="button" class="chip" id="voiceStop">Done</button>
        </div>
      </div>

      <button
        class="orb"
        id="orbBtn"
        type="button"
        aria-label="Speak your budget"
      >
        <span class="orb-glow"></span>
        <span class="orb-ring"></span>
        <span class="orb-pulse"></span>
        <span class="orb-core">
          <span class="orb-blob b1"></span>
          <span class="orb-blob b2"></span>
          <span class="orb-blob b3"></span>
          <svg
            class="orb-mic"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <rect x="9" y="2" width="6" height="12" rx="3"></rect>
            <path d="M5 10a7 7 0 0 0 14 0"></path>
            <line x1="12" y1="19" x2="12" y2="22"></line>
          </svg>
        </span>
      </button>

      <span class="orb-hint" id="orbHint">Tap to speak</span>
    </div>

    <!-- Small message that slides up from the bottom -->
    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <!-- ============ JavaScript: the BRAIN of the app ============ -->
    <script>
      /* ------------------------------------------------------------------
         Tiny helper: $("id") is shorter than document.getElementById("id")
      ------------------------------------------------------------------ */
      const $ = (id) => document.getElementById(id);

      // 1. Grab the parts of the page we need to talk to
      const budgetInput = $("budget");
      const form = $("itemForm");
      const nameInput = $("name");
      const qtyInput = $("qty");
      const priceInput = $("price");
      const listDiv = $("list");
      const totalEl = $("total");
      const remainingEl = $("remaining");
      const summaryEl = $("summary");
      const barFill = $("barFill");
      const clearBtn = $("clearBtn");
      const budgetOut = $("budgetOut");
      const budgetPill = $("budgetPill");
      const countBadge = $("countBadge");

      // Voice elements
      const orbBtn = $("orbBtn");
      const orbHint = $("orbHint");
      const voiceSheet = $("voiceSheet");
      const voiceStatus = $("voiceStatus");
      const voiceTranscript = $("voiceTranscript");
      const voiceStop = $("voiceStop");
      const voiceCancel = $("voiceCancel");
      const toastEl = $("toast");

      // 2. Our data: an array of items, plus the budget number
      let items = [];
      let budget = 0;

      /* ------------------------------------------------------------------
         3. LOAD + SAVE  (localStorage keeps data after you close the page)
      ------------------------------------------------------------------ */
      function load() {
        try {
          items = JSON.parse(localStorage.getItem("mbc_items")) || [];
          budget = Number(localStorage.getItem("mbc_budget")) || 0;
        } catch (e) {
          items = [];
          budget = 0;
        }
        // Make sure every saved item has an id (older saves won't have one)
        items = items.map((it) => (it.id ? it : { ...it, id: uid() }));
        if (budget > 0) budgetInput.value = budget;
      }

      function save() {
        try {
          localStorage.setItem("mbc_items", JSON.stringify(items));
          localStorage.setItem("mbc_budget", String(budget));
        } catch (e) {
          /* if saving is blocked, the app still works */
        }
      }

      // A unique id per item, so removing the right one is always safe
      function uid() {
        return crypto.randomUUID
          ? crypto.randomUUID()
          : "id-" + Date.now() + "-" + Math.random().toString(16).slice(2);
      }

      /* ------------------------------------------------------------------
         4. HELPERS
      ------------------------------------------------------------------ */
      // Turn a number into naira text, e.g. 12500 -> ₦12,500
      function naira(n) {
        return (
          "₦" + Number(n).toLocaleString("en-NG", { maximumFractionDigits: 2 })
        );
      }

      // Slide a small message up from the bottom for ~2.6 seconds
      let toastTimer;
      function toast(message) {
        toastEl.textContent = message;
        toastEl.classList.add("show");
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => toastEl.classList.remove("show"), 2600);
      }

      /* ------------------------------------------------------------------
         5. RENDER — redraw everything on screen from the data
      ------------------------------------------------------------------ */
      // --- KEEP TRACK OF PREVIOUS NUMBERS FOR ANIMATION ---
      let prevTotal = 0;
      let prevBudget = 0;
      let prevRemaining = 0;

      // --- THE NUMBER ROLLING ANIMATOR ---
      function animateValue(el, start, end, duration, formatter) {
        if (start === end) {
          el.textContent = formatter(end);
          return;
        }
        let startTimestamp = null;
        const step = (timestamp) => {
          if (!startTimestamp) startTimestamp = timestamp;
          const progress = Math.min((timestamp - startTimestamp) / duration, 1);
          // Easing function (easeOutQuart) for a snappy, premium feel
          const easeProgress = 1 - Math.pow(1 - progress, 4);
          const current = Math.floor(easeProgress * (end - start) + start);

          el.textContent = formatter(current);

          if (progress < 1) {
            window.requestAnimationFrame(step);
          } else {
            el.textContent = formatter(end); // Ensure exact final number
          }
        };
        window.requestAnimationFrame(step);
      }

      function render() {
        // Add up every item's quantity x price
        let total = 0;
        items.forEach(function (item) {
          total += item.qty * item.price;
        });

        const remaining = budget - total;
        const isOver = budget > 0 && total > budget;
        const percent = budget > 0 ? (total / budget) * 100 : 0;

        // --- TRIGGER ANIMATIONS ---
        animateValue(totalEl, prevTotal, total, 600, naira);
        animateValue(budgetOut, prevBudget, budget, 600, (val) =>
          budget > 0 ? naira(val) : "—",
        );
        animateValue(
          remainingEl,
          prevRemaining,
          remaining,
          600,
          (val) => (val < 0 ? "-" : "") + naira(Math.abs(val)),
        );

        // Save current values for the next time render() runs
        prevTotal = total;
        prevBudget = budget;
        prevRemaining = remaining;

        remainingEl.classList.toggle("negative", remaining < 0);

        // Progress bar never goes past 100% width
        barFill.style.width = Math.min(100, percent) + "%";

        // Little pill in the corner of the summary
        if (budget <= 0) {
          budgetPill.textContent = "No budget set";
        } else if (isOver) {
          budgetPill.textContent = "Over budget";
        } else {
          budgetPill.textContent = Math.round(percent) + "% used";
        }

        // Turn the summary red when over budget
        summaryEl.classList.toggle("over", isOver);

        // Item counter
        countBadge.textContent =
          items.length + (items.length === 1 ? " item" : " items");

        // Draw the list
        if (items.length === 0) {
          listDiv.innerHTML =
            '<div class="empty">No items yet. Add your first one above.</div>';
          return;
        }

        listDiv.innerHTML = "";

        // We use a for loop here so we can get the index for the stagger effect
        items.forEach(function (item, index) {
          const row = document.createElement("div");
          row.className = "item";
          // Pass the index to CSS so it knows how long to wait before animating in
          row.style.setProperty("--i", index);

          const left = document.createElement("div");
          const nameEl = document.createElement("div");
          nameEl.className = "name";
          nameEl.textContent = item.name;

          const detail = document.createElement("div");
          detail.className = "detail";
          detail.textContent = item.qty + " × " + naira(item.price);

          left.appendChild(nameEl);
          left.appendChild(detail);

          const right = document.createElement("div");
          right.className = "item-right";

          const cost = document.createElement("span");
          cost.className = "cost";
          cost.textContent = naira(item.qty * item.price);

          const del = document.createElement("button");
          del.className = "del";
          del.type = "button";
          del.textContent = "×";
          del.setAttribute("aria-label", "Remove " + item.name);

          del.addEventListener("click", function () {
            // Animate the row out before removing it from the array
            row.style.transition = "all 0.2s ease";
            row.style.opacity = "0";
            row.style.transform = "translateX(20px)";

            setTimeout(() => {
              items = items.filter((i) => i.id !== item.id);
              save();
              render();
            }, 200);
          });

          right.appendChild(cost);
          right.appendChild(del);

          row.appendChild(left);
          row.appendChild(right);
          listDiv.appendChild(row);
        });
      }
      // 7. NORMAL APP EVENTS
      // When the budget box changes, update the budget
      budgetInput.addEventListener("input", function () {
        budget = Number(budgetInput.value) || 0;
        save();
        render();
      });
    </script>
  </body>
</html>
